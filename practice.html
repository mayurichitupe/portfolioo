<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            background: #222;
        }

        .container{
            width: 95%;
            height: 90vh;
            background: #ddd;
            margin: 20px auto;
            display: flex;
            justify-content: flex-end;
            align-items: stretch;
            border: 5px solid #222;
        }

        .box{
            width: 150px;
            height: 33.33%;
        }

        .box1{
            background: red;
        }
        .box2{
            background: rgb(0, 255, 0);
        }
        .box3{
            background: blue;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="side-boxes">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
        </div>
    </div>
  <script>
    <script>
// -----------------------------
// Smooth Scroll for Navigation
// -----------------------------
document.querySelectorAll('nav a, .top-btn').forEach(link => {
    link.addEventListener('click', function (e) {
        const href = this.getAttribute("href");
        if (href && href.startsWith("#")) {
            const target = document.querySelector(href);
            if (target) {
                e.preventDefault();
                target.scrollIntoView({
                    behavior: "smooth"
                });
            }
        }
    });
});


// -----------------------------
// Skill Bar Animation on Scroll
// -----------------------------
const skillBars = document.querySelectorAll(".skill-level");

function animateSkills() {
    skillBars.forEach(bar => {
        const level = bar.getAttribute("data-level");
        bar.style.width = level + "%";
    });
}

let skillAnimated = false;

window.addEventListener("scroll", () => {
    const skillSection = document.querySelector("#skills");
    if (!skillSection) return;

    const position = skillSection.getBoundingClientRect().top;

    if (position < window.innerHeight - 100 && !skillAnimated) {
        animateSkills();
        skillAnimated = true;
    }
});


// -----------------------------
// Sticky Navbar
// -----------------------------
const navbar = document.querySelector(".navbar");

window.addEventListener("scroll", () => {
    if (window.scrollY > 100) {
        navbar.classList.add("sticky-nav");
    } else {
        navbar.classList.remove("sticky-nav");
    }
});


// -----------------------------
// Scroll-To-Top Button Show/Hide
// -----------------------------
const topBtn = document.querySelector(".top-btn");

window.addEventListener("scroll", () => {
    if (window.scrollY > 500) {
        topBtn.style.opacity = "1";
        topBtn.style.pointerEvents = "auto";
    } else {
        topBtn.style.opacity = "0";
        topBtn.style.pointerEvents = "none";
    }
});


// -----------------------------
// Resume Download Function
// (called from onclick in HTML)
// -----------------------------
function downloadResume() {
    // change file path to your actual resume
    window.open("./assets/resume.pdf", "_blank");
}
</script>

  </script>
</body>
</html>
