<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Gallery</title>
    <style>
        
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #dcc89e;
}

/* Heading section */
.gallery-heading {
    text-align: center;
    margin: 40px 0 20px;
}

.gallery-heading h1 {
    font-size: 32px;
    font-weight: 600;
}

.underlinework{
    width: 60px;
    height: 4px;
    background: #e05008;
    margin: 10px auto 20px;
    border-radius: 50px;
}

.gallery-heading p {
    color: #555;
    margin-top: 5px;
}

/* Gallery grid */
.gallery-container {
    width: 90%;
    margin: auto;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
}

.gallery-grid img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.gallery-grid img:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

    </style>
</head>
<body>

    <section class="gallery-heading">
        <h1>My Photography Gallery</h1>
        <div class="underlinework"></div>
        <p>Capturing moments, emotions, and stories through my lens.</p>
    </section>
